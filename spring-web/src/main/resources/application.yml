# ===================================================================
# COMMON SPRING BOOT PROPERTIES
# https://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================
debug: false

logging:
    # config: classpath:logback.xml
    # file:
    #   name: logs/todo.log
    pattern:
        # yyyy-MM-dd
        # %replace(%-35.-35logger{0}){' ', '.'}
        # Logback
        #console: "%date{HH:mm:ss.SSS} - %clr(%5level){} - [%30.-30thread] - %clr(%-40.-40logger{0}){magenta} - %message%n"
        # Log4J
        # %notEmpty{[%X{traceId},%X{spanId}] }
        console: "%date{HH:mm:ss.SSS} - %clr{%5level}{} - [%30.-30thread] - %clr{%-40.-40logger{0}}{magenta} - %message %notEmpty{[%X{traceId}] }%n"
    level:
        root: INFO
        org.springframework.core.LocalVariableTableParameterNameDiscoverer: OFF
        io.opentelemetry.exporter: DEBUG
        io.opentelemetry.sdk: DEBUG
        okhttp3: DEBUG

# Is spring-boot-starter-parent the Parent-POM, Resource-Delimiter is @.
info:
    app:
        name: @project_artifactId@
        description: @project_description@
        version: @project_version@

server:
    compression:
        enabled: true
        min-response-size: 2048
        mime-types: application/javascript, application/json, application/x-yaml, application/xml, text/css, text/csv, text/html, text/javascript, text/plain
    http2:
        enabled: true
    port: ${SERVER_PORT:8088}
    servlet:
        context-path: /@project_artifactId@
        session:
            timeout: 30
    shutdown: graceful
    ssl:
        enabled: false
    tomcat:
        threads:
            max: 8
            min-spare: 4

spring:
    output:
        ansi:
            #enabled: DETECT
            enabled: ALWAYS
            #enabled: NEVER
    lifecycle:
        timeout-per-shutdown-phase: 30s
    servlet:
        encoding:
            enabled: true
            charset: UTF-8

#<form action="http://localhost:8088/spring-web/actuator/shutdown" method="post" id="form_shutdown">
#<form action="shutdown" method="post" id="form_shutdown">
#   <button type="submit">System shutdown</button>
#</form>
# curl -X POST HOST:PORT/shutdown
# view-source:http://localhost:8088/spring-web/actuator/info
# view-source:http://localhost:8088/spring-web/actuator/health
# view-source:http://localhost:8088/spring-web/actuator/metrics
management:
    #    server:
    #        port: 8089
    endpoints:
        access:
            default: NONE
        web:
            base-path: /actuator
            exposure:
                #include: "*"
                include: health, info, metrics, shutdown
    endpoint:
        health:
            access: READ_ONLY
            show-details: ALWAYS
        info:
            access: READ_ONLY
        metrics:
            access: READ_ONLY
        shutdown:
            access: UNRESTRICTED
    info:
        defaults:
            enabled: true
        env:
            enabled: true
    health:
        defaults:
            enabled: true
    tracing:
        export:
            enabled: true # Schaltet NUR den Export ab, Tracer + MDC bleiben aktiv: opentelemetry.tracing.export.otlp.endpoint
        sampling:
            probability: 1.0 # DEV: 100 %; PROD eher 0.1 (10 %)
    otlp:
        metrics:
            export:
                enabled: false # Schaltet den Export der Metriken ab.
    opentelemetry:
        tracing:
            export:
                otlp:
                    endpoint: http://localhost:${SERVER_PORT:8088}/@project_artifactId@/v1/traces
                    compression: none

---

spring:
    config:
        activate:
            on-profile: shutdown

logging:
    level:
        org.springframework.beans.factory.config.YamlPropertiesFactoryBean: INFO
