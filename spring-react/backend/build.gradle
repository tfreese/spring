// Vite-Ausgabe wird als generierte Resource in das Spring-Boot-JAR übernommen.
processResources {
    dependsOn(":spring-react:frontend:npmBuild")

    from(project(":spring-react:frontend").layout.projectDirectory.dir("dist")) {
        into("static")
    }
}

bootJar {
    archiveFileName = "backend-${version}.jar"
}

