processResources {
    dependsOn(":spring-angular:frontend:npmBuild")

    from(project(":spring-angular:frontend").layout.projectDirectory.dir("dist/browser")) {
        into("static")
    }
}

bootJar {
    archiveFileName = "backend-${version}.jar"
}

