debug: false

spring:
    artemis:
        #broker-url: vm://0
        #broker-url: tcp://localhost:61616
        mode: embedded
        embedded:
            enabled: true
            persistent: false
            queues: mailbox

logging:
    level:
        root: INFO
        org.apache.activemq: ERROR
        org.apache.activemq.artemis.core.server: INFO
        org.springframework: INFO
